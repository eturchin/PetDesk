name: Build and package

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows build, tests and packages
    runs-on: windows-latest
    timeout-minutes: 25
    defaults:
      run:
        shell: pwsh
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: 'true'

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/packages.lock.json'

      - name: Check public repository contents
        run: ./tools/Check-Repository.ps1

      - name: Locate Inno Setup
        run: |
          function Find-Compiler {
            $command = Get-Command ISCC.exe -ErrorAction SilentlyContinue
            if ($command) { return $command.Source }
            foreach ($base in @(${env:ProgramFiles(x86)}, $env:ProgramFiles)) {
              if (!$base) { continue }
              foreach ($version in @('Inno Setup 7', 'Inno Setup 6')) {
                $candidate = Join-Path $base "$version/ISCC.exe"
                if (Test-Path -LiteralPath $candidate) { return $candidate }
              }
            }
          }
          $compiler = Find-Compiler
          if (!$compiler) {
            choco install innosetup --yes --no-progress
            if ($LASTEXITCODE -ne 0) { throw 'Inno Setup installation failed.' }
            $compiler = Find-Compiler
          }
          if (!$compiler) { throw 'Inno Setup compiler not found.' }
          "INNO_SETUP_COMPILER=$compiler" >> $env:GITHUB_ENV

      - name: Restore, check formatting, build, test and package
        run: ./tools/Package-Release.ps1 -ISCCPath $env:INNO_SETUP_COMPILER

      - name: Upload installer, portable ZIP and checksums
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: PetDesk-win-x64
          path: artifacts/Releases/*/*
          if-no-files-found: error
          retention-days: 14

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-results
          path: artifacts/TestResults/*.trx
          if-no-files-found: warn
          retention-days: 14
